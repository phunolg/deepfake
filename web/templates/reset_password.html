<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu — DeepGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-page">
    <a class="wordmark" href="/">DeepGuard</a>
    <form class="auth-card auth-form" method="post">
      <p class="kicker">MẬT KHẨU MỚI</p>
      <h1>Đặt lại mật khẩu</h1>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <input type="hidden" name="token" value="{{ token }}">
      <label>Mật khẩu mới<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Nhập lại mật khẩu<input name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
      <button class="button button-dark" type="submit">Cập nhật mật khẩu</button>
    </form>
  </main>
</body>
</html>
