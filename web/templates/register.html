<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký — DeepGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-page">
    <a class="wordmark" href="/">DeepGuard</a>
    <form class="auth-card auth-form" method="post">
      <p class="kicker">TẠO TÀI KHOẢN</p>
      <h1>Đăng ký DeepGuard</h1>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <label>Họ tên<input name="full_name" type="text" maxlength="120" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Mật khẩu<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
      <label>Nhập lại mật khẩu<input name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></label>
      <label class="checkbox-label"><input name="accept_terms" type="checkbox" required> Tôi đồng ý với điều khoản sử dụng và chính sách quyền riêng tư.</label>
      <button class="button button-dark" type="submit">Đăng ký</button>
      <p class="auth-link">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
    </form>
  </main>
</body>
</html>
