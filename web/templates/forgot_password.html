<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu — DeepGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="auth-page">
    <a class="wordmark" href="/">DeepGuard</a>
    <form class="auth-card auth-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <p class="kicker">KHÔI PHỤC TÀI KHOẢN</p>
      <h1>Quên mật khẩu?</h1>
      <p class="muted">Nhập email đã đăng ký. Liên kết đặt lại mật khẩu có hiệu lực trong 1 giờ.</p>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      {% if message %}<div class="alert success">{{ message }}</div>{% endif %}
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <button class="button button-dark" type="submit">Gửi liên kết</button>
      <a class="auth-link" href="{{ url_for('login') }}">Quay lại đăng nhập</a>
    </form>
  </main>
</body>
</html>
